name: Deploy site on main

# Single-branch deploy. Builds the client and commits the site to the repo root.
# GitHub Pages should use: branch main · folder / (root)
# https://yunusbashashaik.github.io/Premium_Store-Qatar/

on:
  push:
    branches: [main]
    paths-ignore:
      - "index.html"
      - "404.html"
      - "assets/**"
      - ".nojekyll"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-deploy-main
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Build client
        run: npm run build -w client
        env:
          VITE_BASE_PATH: /Premium_Store-Qatar/

      - name: Publish built site to repository root on main
        run: |
          rm -rf assets docs
          cp -a client/dist/. .
          cp client/dist/index.html 404.html
          touch .nojekyll
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A index.html 404.html .nojekyll assets \
            favicon.ico favicon.jpg logo.jpg \
            hero-wallpaper-hd.jpg hero-wallpaper.jpg \
            runtime-config.js sitemap.xml
          git add -u docs || true
          if git diff --cached --quiet; then
            echo "No Pages files changed"
            exit 0
          fi
          git commit -m "Publish GitHub Pages from main root"
          git push origin HEAD:main
